name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  secrets:
    uses: ./.github/workflows/secrets.yml
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:css
      - run: npm run typecheck
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:a11y
  deploy-preview:
    needs: [validate, secrets, security]
    if: vars.CLOUDFLARE_DEPLOY_ENABLED == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/d1-read-foundation'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: israel-hikes-preview
      cancel-in-progress: false
    environment:
      name: preview
      url: https://israel-hikes-preview.amikamsnir.workers.dev/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify account token (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-cloudflare.mjs
      - name: Read scoped Worker metadata diagnostics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/diagnose-worker-metadata.mjs
      - name: Select narrow one-time dashboard bootstrap version
        id: preview-wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/production-wrangler-version.mjs israel-hikes-preview
      - name: Deploy only israel-hikes-preview
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ steps.preview-wrangler.outputs.version }}
          preCommands: node scripts/production-wrangler-version.mjs --patch-scoped-subdomain
          command: deploy --config wrangler.preview.jsonc --name israel-hikes-preview
      - name: Verify preview serves this exact build
        run: node scripts/check-live-assets.mjs https://israel-hikes-preview.amikamsnir.workers.dev/
      - name: Save exact tested static assets for production
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-dist
          path: dist
          retention-days: 7
          if-no-files-found: error
  deploy-production:
    needs: [validate, deploy-preview]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: israel-hikes-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://israel-hikes.amikamsnir.workers.dev/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Download the exact preview static assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preview-dist
          path: dist
      - name: Verify account token (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-cloudflare.mjs
      - name: Select narrow one-time dashboard bootstrap version
        id: production-wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/production-wrangler-version.mjs
      - name: Deploy only israel-hikes after owner environment approval
        id: production-upload
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ steps.production-wrangler.outputs.version }}
          preCommands: node scripts/production-wrangler-version.mjs --patch-scoped-subdomain
          command: deploy --config wrangler.jsonc --name israel-hikes
      - name: Verify production serves the approved build
        if: ${{ always() && (steps.production-upload.outcome == 'success' || steps.production-upload.outcome == 'failure') }}
        run: node scripts/check-live-assets.mjs https://israel-hikes.amikamsnir.workers.dev/
