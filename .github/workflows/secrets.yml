name: Secret scan
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25'
          cache: false
      - name: Install pinned free scanner
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Check scanner rejects a synthetic credential
        shell: bash
        run: |
          set +e
          printf 'token = "ghp_%s"\n' "$(openssl rand -hex 18)" | gitleaks stdin --redact --no-banner
          result=$?
          set -e
          test "$result" -eq 1
      - name: Scan full checkout history with redacted findings
        run: gitleaks git --redact --no-banner .
